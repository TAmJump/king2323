name: FX update

# Runs daily at 00:00 JST (= 15:00 UTC the previous day).
# Fetches USD/JPY from exchangerate-api.com and commits js/fx.json
# only when the rate changes. Site reads fx.json at runtime; no
# code deploy is needed.
#
# Manual trigger via "Run workflow" in the Actions tab.

on:
  schedule:
    - cron: '0 15 * * *'   # 00:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch USD/JPY rate
        id: fx
        run: |
          set -euo pipefail
          # Free, no-API-key endpoint. Falls back to frankfurter.app on error.
          PRIMARY="https://open.er-api.com/v6/latest/USD"
          BACKUP="https://api.frankfurter.app/latest?from=USD&to=JPY"

          RAW="$(curl -fsSL --max-time 10 "$PRIMARY" || true)"
          RATE=""
          if [ -n "$RAW" ]; then
            RATE="$(printf '%s' "$RAW" | python3 -c \
              'import sys,json; d=json.load(sys.stdin); r=d.get("rates",{}).get("JPY"); print(r if r else "")')"
          fi

          if [ -z "$RATE" ]; then
            echo "Primary failed, trying backup…"
            RAW="$(curl -fsSL --max-time 10 "$BACKUP")"
            RATE="$(printf '%s' "$RAW" | python3 -c \
              'import sys,json; d=json.load(sys.stdin); r=d.get("rates",{}).get("JPY"); print(r if r else "")')"
          fi

          if [ -z "$RATE" ]; then
            echo "Both FX sources failed; aborting without commit."
            exit 1
          fi

          # Round to 2 decimal places
          RATE_2DP="$(python3 -c "print(round(float('$RATE'), 2))")"
          DATE="$(date -u +%Y-%m-%d)"
          echo "rate=$RATE_2DP" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Rate: $RATE_2DP on $DATE"

      - name: Write fx.json
        run: |
          cat > js/fx.json <<JSON
          {
            "USD_JPY": ${{ steps.fx.outputs.rate }},
            "source": "open.er-api.com",
            "updated": "${{ steps.fx.outputs.date }}",
            "note": "Auto-generated by .github/workflows/fx-update.yml at 00:00 JST daily."
          }
          JSON
          cat js/fx.json

      - name: Commit if changed
        run: |
          if git diff --quiet js/fx.json; then
            echo "No rate change since last run — skipping commit."
            exit 0
          fi
          git config user.name 'fx-bot'
          git config user.email 'fx-bot@users.noreply.github.com'
          git add js/fx.json
          git commit -m "fx: USD/JPY = ${{ steps.fx.outputs.rate }} on ${{ steps.fx.outputs.date }}"
          git push
